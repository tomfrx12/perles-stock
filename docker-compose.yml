services:
  perles-stock:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/data
      - ./uploads:/data/uploads
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.perles.rule=Host(`perles.tom-fourneaux.fr`)"
      - "traefik.http.routers.perles.entrypoints=websecure"
      - "traefik.http.routers.perles.tls.certresolver=myresolver"
      - "traefik.http.services.perles.loadbalancer.server.port=3000"

      # BasicAuth — la valeur vient de BASIC_AUTH_USERS dans .env (non versionné).
      # Générer avec :  htpasswd -nB tonnom
      # puis dans .env, entre apostrophes simples (pas de doublement des $) :
      #   BASIC_AUTH_USERS='tonnom:$2y$05$...'
      # Pour plusieurs utilisateurs, séparer par virgule.
      - "traefik.http.routers.perles.middlewares=perles-auth"
      - "traefik.http.middlewares.perles-auth.basicauth.users=${BASIC_AUTH_USERS:?BASIC_AUTH_USERS manquant dans .env}"
    networks:
      - web

networks:
  web:
    external: true
