services:
  perles-stock:
    build: .
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.perles.rule=Host(`perles.tom-fourneaux.fr`)"
      - "traefik.http.routers.perles.entrypoints=websecure"
      - "traefik.http.routers.perles.tls.certresolver=myresolver"

      # BasicAuth — remplacer la valeur par le hash généré avec :
      #   htpasswd -nb tonnom tonmotdepasse | sed 's/\$/\$\$/g'
      # Pour plusieurs utilisateurs, séparer par virgule.
      - "traefik.http.routers.perles.middlewares=perles-auth"
      - "traefik.http.middlewares.perles-auth.basicauth.users=tom:$$apr1$$gdCmNr5c$$LDOYGf9QLXNkvvuYYju79."
    networks:
      - web

networks:
  web:
    external: true